name: Deploy Next.js (estático) a EC2 + S3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build con assetPrefix hacia S3
        run: npm run build
        env:
          ASSET_PREFIX: https://${{ secrets.S3_BUCKET }}.s3.us-east-1.amazonaws.com

      - name: Verificar secrets
        env:
          A: ${{ secrets.AWS_ACCESS_KEY_ID }}
          B: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          C: ${{ secrets.AWS_SESSION_TOKEN }}
          D: ${{ secrets.S3_BUCKET }}
        run: |
          echo "ACCESS_KEY: ${#A} caracteres"
          echo "SECRET_KEY: ${#B} caracteres"
          echo "SESSION_TOKEN: ${#C} caracteres"
          echo "S3_BUCKET: ${#D} caracteres"

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Subir estáticos (_next) a S3
        run: |
          aws s3 sync ./out/_next s3://${{ secrets.S3_BUCKET }}/_next \
            --cache-control "public,max-age=31536000,immutable"

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copiar HTML y el resto a EC2 (sin _next)
        run: |
          rsync -avz --delete --exclude '_next/' -e "ssh -i ~/.ssh/key.pem" \
            ./out/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/